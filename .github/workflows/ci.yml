name: CI YOUGile

on:
  push:
    branches:
      - 'feature/**'

jobs:

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Notify failure
        if: failure()
        env:
          YOUGILE_TOKEN: ${{ secrets.YOUGILE_TOKEN }}
        run: |
          curl -X POST https://ru.yougile.com/api-v2/tasks \
            -H "Authorization: Bearer GsacQ+69vxWTLbkh0ZyP6VWYDAGv+3iU0rC-dzloWnYvypYNeXHXTKsUQE+QfL+X" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "тесты упали",
              "columnId": "24e33273-a286-44c2-a016-786354b70a04",
              "description": "Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}"
            }'

      - name: Install dependencies
        if: success()
        run: pip install -r requirements.txt

      - name: Create PR with YouGile checklist
        if: success()
        env:
          YOUGILE_TOKEN: ${{ secrets.YOUGILE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          YOUGILE_COLUMN_ID: ${{ secrets.YOUGILE_COLUMN_ID }}
          YOUGILE_BOARD_ID: ${{ secrets.YOUGILE_BOARD_ID }}
          BRANCH: ${{ github.ref_name }}
        run: python3 -m app.create_pr

