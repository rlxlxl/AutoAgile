name: CI YOUGile

on:
  push:
    branches:
      - 'feature/**'

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Notify failure
        if: failure()
        env:
          YOUGILE_TOKEN: ${{ secrets.YOUGILE_TOKEN }}
        run: |
          curl -X POST https://ru.yougile.com/api-v2/tasks \
            -H "Authorization: Bearer GsacQ+69vxWTLbkh0ZyP6VWYDAGv+3iU0rC-dzloWnYvypYNeXHXTKsUQE+QfL+X" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "тесты упали",
              "columnId": "24e33273-a286-44c2-a016-786354b70a04",
              "description": "Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}"
            }'

      - name: Create PR with YouGile checklist
        if: success()
        env:
          YOUGILE_TOKEN: ${{ secrets.YOUGILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUGILE_COLUMN_ID: "0904c3b9-7078-4cfe-b547-794b30706260"
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request

          github_repo = os.environ.get('GITHUB_REPOSITORY')
          branch = os.environ.get('BRANCH') or os.environ.get('GITHUB_REF_NAME') or os.environ.get('GITHUB_REF', '').split('/')[-1]
          you_token = os.environ.get('YOUGILE_TOKEN')
          col = os.environ.get('YOUGILE_COLUMN_ID')

          headers = {"Authorization": f"Bearer {you_token}", "Content-Type": "application/json"}

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          checklist_md = ""
          try:
              url = f"https://ru.yougile.com/api-v2/tasks?columnId={col}&size=100"
              data = get_json(url)
              items = data.get('content', data) if isinstance(data, dict) else data
              target = None
              for it in items:
                  desc = it.get('description','') or ''
                  if branch and branch in desc:
                      target = it
                      break

              if target:
                  tid = target.get('id')
                  task = get_json(f"https://ru.yougile.com/api-v2/tasks/{tid}")
                  checks = []
                  for cl in task.get('checklists', []) or []:
                      for item in cl.get('items', []) or []:
                          title = item.get('title') or item.get('text') or item.get('name')
                          if title:
                              checks.append(title)
                  if checks:
                      checklist_md = "\n\n" + "\n".join([f"- [ ] {c}" for c in checks])
          except Exception:
              checklist_md = ""

          body = "Auto PR after CI success" + checklist_md

          gh_headers = {"Authorization": f"Bearer {os.environ.get('GITHUB_TOKEN')}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"}
          pr_url = f"https://api.github.com/repos/{github_repo}/pulls"
          title = f"Auto PR: {branch} → dev"
          payload = {"title": title, "head": branch, "base": "dev", "body": body}
          data = json.dumps(payload).encode()
          req = urllib.request.Request(pr_url, data=data, headers=gh_headers, method='POST')
          with urllib.request.urlopen(req) as resp:
              print(resp.read().decode())
          PY

      # - name: Create YouGile task (PR review)
