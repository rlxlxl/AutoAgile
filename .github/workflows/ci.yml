name: CI YOUGile

on:
  push:
    branches:
      - 'feature/**'

jobs:

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Notify failure
        if: failure()
        run: |
          python3 - <<'PY'
          from app.config import load_yougile_settings
          import json, os, urllib.request

          settings = load_yougile_settings()
          payload = {
              "title": "тесты упали",
              "columnId": "24e33273-a286-44c2-a016-786354b70a04",
              "description": f"Branch: {os.environ['GITHUB_REF_NAME']} | Commit: {os.environ['GITHUB_SHA']}",
          }
          req = urllib.request.Request(
              "https://ru.yougile.com/api-v2/tasks",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {settings['token']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.read().decode())
          PY

      - name: Create PR with YouGile checklist
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: python3 -m app.create_pr

