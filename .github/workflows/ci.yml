      #       -d '{
      #         "title": "Проверь Pull Request",
      #         "columnId": "0904c3b9-7078-4cfe-b547-794b30706260",
      #         "description": "PR создан после успешного CI | Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}"
      #       }'